name: Standalone benchmark

on:
  workflow_dispatch:
    inputs:
      count:
        description: Jobs expiring at the same instant
        required: true
        default: "1000"
        type: string
      workers:
        description: Scheduler execution workers
        required: true
        default: "16"
        type: string
      scheduler_interval:
        description: Due-job scan interval
        required: true
        default: "1s"
        type: string

permissions:
  contents: read

concurrency:
  group: standalone-benchmark
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_COUNT: ${{ inputs.count }}
      BENCH_WORKERS: ${{ inputs.workers }}
      BENCH_SCHEDULER_INTERVAL: ${{ inputs.scheduler_interval }}
      BENCH_LEAD_SECONDS: "120"
      BENCH_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BENCH_ARTIFACT_DIR: benchmark-artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run local-equivalent integration benchmark
        run: make integration-benchmark
      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standalone-burst-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-artifacts
          if-no-files-found: error
          retention-days: 30
