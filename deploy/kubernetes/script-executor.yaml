apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler-executor}
spec:
  replicas: 2
  selector: {matchLabels: {app: scheduler-executor}}
  template:
    metadata: {labels: {app: scheduler-executor}}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: executor
          image: ghcr.io/lihongjie0209/go-scheduler:latest
          args: ["executor"]
          ports: [{name: grpc, containerPort: 9999}]
          envFrom: [{secretRef: {name: scheduler-secrets}}, {configMapRef: {name: scheduler-executor-config}}]
          env:
            - {name: SCHEDULER_GRPC_ADDRESS, value: "dns:///scheduler-core:9090"}
            - {name: EXECUTOR_NODE_ID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - name: EXECUTOR_ADVERTISE_HOST
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          readinessProbe: {grpc: {port: 9999}, periodSeconds: 5}
          livenessProbe: {grpc: {port: 9999}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
