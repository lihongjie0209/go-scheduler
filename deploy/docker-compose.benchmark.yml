services:
  scheduler-server:
    environment:
      WORKERS: "${BENCH_WORKERS:-64}"
      SCHEDULER_INTERVAL: "${BENCH_SCHEDULER_INTERVAL:-1s}"
    depends_on:
      benchmark-sink:
        condition: service_started

  benchmark-sink:
    build:
      context: ..
      args:
        TARGET: scheduler-bench
    command: ["serve", "--listen", ":19090"]
    ports: ["19090:19090"]

  executor:
    build:
      context: ..
      dockerfile: deploy/benchmark-executor.Dockerfile
    environment:
      SCHEDULER_TOKEN: "compose-internal-service-token-change-in-production"
      EXECUTOR_TENANT_ID: "${BENCH_EXECUTOR_TENANT_ID:-}"
      EXECUTOR_GROUP_ID: "${BENCH_EXECUTOR_GROUP_ID:-}"
      EXECUTOR_MAX_CONCURRENCY: "${BENCH_EXECUTOR_MAX_CONCURRENCY:-256}"
      EXECUTOR_SHUTDOWN_TIMEOUT: "${BENCH_EXECUTOR_SHUTDOWN_TIMEOUT:-5s}"
      DOCKER_ENABLED: "false"
      KUBERNETES_ENABLED: "false"
