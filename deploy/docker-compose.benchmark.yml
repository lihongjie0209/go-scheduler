services:
  scheduler-server:
    environment:
      WORKERS: "${BENCH_WORKERS:-16}"
      SCHEDULER_INTERVAL: "${BENCH_SCHEDULER_INTERVAL:-1s}"
    depends_on:
      benchmark-sink:
        condition: service_started

  benchmark-sink:
    build:
      context: ..
      args:
        TARGET: scheduler-bench
    command: ["serve", "--listen", ":19090"]
    ports: ["19090:19090"]
