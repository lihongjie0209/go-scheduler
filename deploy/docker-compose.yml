services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
      args: {POSTGRES_MAJOR: "16", PG_PARTMAN_VERSION: "5.5.0"}
    image: go-scheduler-postgres:16-partman-5.5.0
    environment: {POSTGRES_DB: scheduler, POSTGRES_USER: scheduler, POSTGRES_PASSWORD: scheduler}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U scheduler -d scheduler"], interval: 2s, timeout: 2s, retries: 20, start_period: 10s}
    command: [postgres, -c, shared_preload_libraries=pg_partman_bgw, -c, pg_partman_bgw.dbname=scheduler, -c, pg_partman_bgw.role=scheduler, -c, pg_partman_bgw.interval=3600]
  migrate:
    build: {context: .., args: {TARGET: scheduler}}
    command: [migrate]
    environment: {DATABASE_URL: "postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable"}
    depends_on: {postgres: {condition: service_healthy}}
  bootstrap:
    build: {context: .., args: {TARGET: scheduler}}
    command: [bootstrap]
    environment: &app-env
      DATABASE_URL: "postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable"
      SERVICE_TOKEN: "compose-internal-service-token-change-in-production"
      MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      JWT_SECRET: "compose-jwt-secret-change-in-production-at-least-32-bytes"
      TENANT_NAME: "演示租户"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "SchedulerDemo123!"
    depends_on: {migrate: {condition: service_completed_successfully}}
  scheduler-server:
    build: {context: .., args: {TARGET: scheduler}}
    command: [server]
    environment:
      <<: *app-env
      HTTP_ADDRESS: ":8080"
      GRPC_ADDRESS: ":9090"
      API_CONTEXT_PATH: ""
      PUBLIC_BASE_URL: "http://scheduler-server:8080"
      COOKIE_SECURE: "false"
      INSTANCE_ID: "standalone-compose-1"
      API_DATABASE_MAX_CONNS: "8"
      CORE_DATABASE_MAX_CONNS: "24"
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    ports: ["18080:8080"]
  executor:
    profiles: [executor]
    build:
      context: ..
      dockerfile: deploy/script-executor/Dockerfile
    environment:
      SCHEDULER_GRPC_ADDRESS: "scheduler-server:9090"
      SCHEDULER_TOKEN: "${SCHEDULER_EXECUTOR_TOKEN:-}"
      EXECUTOR_GROUP_ID: "${SCHEDULER_EXECUTOR_GROUP_ID:-}"
      EXECUTOR_NODE_ID: "compose-executor-1"
      EXECUTOR_ADVERTISE_ADDRESS: "grpc://executor:9999"
      EXECUTOR_LABELS: "${SCHEDULER_EXECUTOR_LABELS:-linux,docker,kubernetes}"
      EXECUTOR_MAX_CONCURRENCY: "${SCHEDULER_EXECUTOR_MAX_CONCURRENCY:-32}"
      DOCKER_ENABLED: "true"
      KUBERNETES_ENABLED: "true"
      DOCKER_CONFIG: "/docker-auth"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DOCKER_CONFIG_DIR:-./docker-auth}:/docker-auth:ro"
    depends_on:
      scheduler-server: {condition: service_started}
