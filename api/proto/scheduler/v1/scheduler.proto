syntax = "proto3";

package scheduler.v1;

option go_package = "github.com/lihongjie0209/go-scheduler/gen/scheduler/v1;schedulerv1";

import "google/protobuf/timestamp.proto";

service SchedulerService {
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  rpc ListJobScriptVersions(ListJobScriptVersionsRequest) returns (ListJobScriptVersionsResponse);
  rpc RollbackJobScriptVersion(RollbackJobScriptVersionRequest) returns (Job);
  rpc SetJobEnabled(SetJobEnabledRequest) returns (Job);
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
  rpc TriggerJob(TriggerJobRequest) returns (Run);
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);
  rpc GetRun(GetRunRequest) returns (Run);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (Run);
  rpc SetJobDependencies(SetJobDependenciesRequest) returns (JobDependencies);
  rpc GetJobDependencies(GetJobDependenciesRequest) returns (JobDependencies);
  rpc CompleteCallback(CompleteCallbackRequest) returns (CompleteCallbackResponse);
  rpc CreateExecutorGroup(CreateExecutorGroupRequest) returns (ExecutorGroup);
  rpc UpdateExecutorGroup(UpdateExecutorGroupRequest) returns (ExecutorGroup);
  rpc DeleteExecutorGroup(DeleteExecutorGroupRequest) returns (DeleteExecutorGroupResponse);
  rpc ListExecutorGroups(ListExecutorGroupsRequest) returns (ListExecutorGroupsResponse);
  rpc RegisterExecutorNode(RegisterExecutorNodeRequest) returns (ExecutorNode);
  rpc UnregisterExecutorNode(UnregisterExecutorNodeRequest) returns (UnregisterExecutorNodeResponse);
  rpc ListExecutorNodes(ListExecutorNodesRequest) returns (ListExecutorNodesResponse);
  rpc AppendRunLogs(AppendRunLogsRequest) returns (AppendRunLogsResponse);
  rpc ListRunLogs(ListRunLogsRequest) returns (ListRunLogsResponse);
  rpc CreateNotificationChannel(CreateNotificationChannelRequest) returns (NotificationChannel);
  rpc UpdateNotificationChannel(UpdateNotificationChannelRequest) returns (NotificationChannel);
  rpc SetNotificationChannelEnabled(SetNotificationChannelEnabledRequest) returns (NotificationChannel);
  rpc DeleteNotificationChannel(DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse);
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse);
  rpc ListNotificationHistory(ListNotificationHistoryRequest) returns (ListNotificationHistoryResponse);
  rpc GetRunReport(GetRunReportRequest) returns (RunReport);
  rpc PurgeRunHistory(PurgeRunHistoryRequest) returns (PurgeRunHistoryResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc AuthenticateAPIKey(AuthenticateAPIKeyRequest) returns (AuthenticateAPIKeyResponse);
  rpc GetUser(GetUserRequest) returns (User);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User);
  rpc GetMembershipRole(GetMembershipRoleRequest) returns (GetMembershipRoleResponse);
  rpc ListUserTenants(ListUserTenantsRequest) returns (ListUserTenantsResponse);
  rpc CreateRefreshSession(CreateRefreshSessionRequest) returns (CreateRefreshSessionResponse);
  rpc RotateRefreshSession(RotateRefreshSessionRequest) returns (RotateRefreshSessionResponse);
  rpc RevokeRefreshSession(RevokeRefreshSessionRequest) returns (RevokeRefreshSessionResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc SetUserDisabled(SetUserDisabledRequest) returns (SetUserDisabledResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse);
  rpc AddMembership(AddMembershipRequest) returns (AddMembershipResponse);
  rpc DeleteMembership(DeleteMembershipRequest) returns (DeleteMembershipResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc GetDashboard(GetDashboardRequest) returns (Dashboard);
  rpc ListKubernetesClusters(ListKubernetesClustersRequest) returns (ListKubernetesClustersResponse);
  rpc GetKubernetesCluster(GetKubernetesClusterRequest) returns (KubernetesCluster);
  rpc CreateKubernetesCluster(CreateKubernetesClusterRequest) returns (KubernetesCluster);
  rpc UpdateKubernetesCluster(UpdateKubernetesClusterRequest) returns (KubernetesCluster);
  rpc DeleteKubernetesCluster(DeleteKubernetesClusterRequest) returns (DeleteKubernetesClusterResponse);
}

message Job {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string schedule_type = 5;
  string schedule_expression = 6;
  string timezone = 7;
  string target_url = 8;
  string http_method = 9;
  map<string, string> headers = 10;
  string body_template = 11;
  int32 timeout_seconds = 12;
  int32 max_retries = 13;
  string overlap_policy = 14;
  string misfire_policy = 15;
  bool enabled = 16;
  google.protobuf.Timestamp next_run_at = 17;
  int64 version = 18;
  int32 max_concurrent_runs = 19;
  int32 max_catch_up = 20;
  int32 callback_timeout_seconds = 21;
  int32 max_queue_size = 22;
  string executor_group_id = 23;
  string executor_handler = 24;
  string script_language = 25;
  string script_source = 26;
  repeated string required_executor_labels = 27;
  repeated string excluded_executor_labels = 28;
  string kubernetes_cluster_id = 29;
  DockerRegistryAuth docker_registry_auth = 30;
  bool clear_docker_registry_auth = 31;
}

message DockerRegistryAuth {
  string server = 1;
  string username = 2;
  string password = 3;
  bool configured = 4;
}

message CreateJobRequest { Job job = 1; }
message GetJobRequest { string tenant_id = 1; string id = 2; }
message ListJobsRequest { string tenant_id = 1; int32 limit = 2; string cursor = 3; }
message ListJobsResponse { repeated Job jobs = 1; string next_cursor = 2; }
message UpdateJobRequest { Job job = 1; }
message JobScriptVersion {
  string id = 1;
  string job_id = 2;
  int64 revision = 3;
  string script_language = 4;
  string script_source = 5;
  string remark = 6;
  google.protobuf.Timestamp created_at = 7;
}
message ListJobScriptVersionsRequest { string tenant_id = 1; string job_id = 2; }
message ListJobScriptVersionsResponse { repeated JobScriptVersion versions = 1; }
message RollbackJobScriptVersionRequest {
  string tenant_id = 1;
  string job_id = 2;
  string version_id = 3;
  int64 job_version = 4;
  string remark = 5;
}
message SetJobEnabledRequest { string tenant_id = 1; string id = 2; bool enabled = 3; int64 version = 4; }
message DeleteJobRequest { string tenant_id = 1; string id = 2; int64 version = 3; }
message DeleteJobResponse {}
message TriggerJobRequest { string tenant_id = 1; string job_id = 2; string idempotency_key = 3; string input = 4; repeated string override_addresses = 5; }
message PreviewScheduleRequest {
  string schedule_type = 1;
  string schedule_expression = 2;
  string timezone = 3;
  google.protobuf.Timestamp after = 4;
  int32 count = 5;
}
message PreviewScheduleResponse { repeated google.protobuf.Timestamp trigger_times = 1; }

message Run {
  string id = 1;
  string tenant_id = 2;
  string job_id = 3;
  string status = 4;
  int32 attempt = 5;
  google.protobuf.Timestamp scheduled_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  int32 response_status = 9;
  string error_message = 10;
  string parent_run_id = 11;
  string retry_of_run_id = 12;
  string trigger_type = 13;
  string executor_node_id = 14;
  string executor_address = 15;
  string broadcast_group_id = 16;
  int32 shard_index = 17;
  int32 shard_total = 18;
  repeated string override_addresses = 19;
  string external_execution_id = 20;
}

message GetRunRequest { string tenant_id = 1; string run_id = 2; }
message ListRunsRequest { string tenant_id = 1; string job_id = 2; int32 limit = 3; string broadcast_group_id = 4; }
message ListRunsResponse { repeated Run runs = 1; }
message CancelRunRequest { string tenant_id = 1; string run_id = 2; string reason = 3; }
message SetJobDependenciesRequest { string tenant_id = 1; string parent_job_id = 2; repeated string child_job_ids = 3; }
message GetJobDependenciesRequest { string tenant_id = 1; string parent_job_id = 2; }
message JobDependencies { string parent_job_id = 1; repeated string child_job_ids = 2; }
message CompleteCallbackRequest { string run_id = 1; string token = 2; bool succeeded = 3; string message = 4; }
message CompleteCallbackResponse {}

message ExecutorGroup {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string route_strategy = 4;
  int64 version = 5;
  string registration_mode = 6;
  repeated string manual_addresses = 7;
}
message CreateExecutorGroupRequest { ExecutorGroup group = 1; }
message UpdateExecutorGroupRequest { ExecutorGroup group = 1; }
message DeleteExecutorGroupRequest { string tenant_id = 1; string id = 2; int64 version = 3; }
message DeleteExecutorGroupResponse {}
message ListExecutorGroupsRequest { string tenant_id = 1; }
message ListExecutorGroupsResponse { repeated ExecutorGroup groups = 1; }
message ExecutorNode {
  string group_id = 1;
  string node_id = 2;
  string address = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool online = 6;
  bool static = 7;
  repeated string labels = 8;
}
message RegisterExecutorNodeRequest {
  string tenant_id = 1;
  string group_id = 2;
  string node_id = 3;
  string address = 4;
  int32 ttl_seconds = 5;
  repeated string labels = 6;
}
message UnregisterExecutorNodeRequest { string tenant_id = 1; string group_id = 2; string node_id = 3; }
message UnregisterExecutorNodeResponse {}
message ListExecutorNodesRequest { string tenant_id = 1; string group_id = 2; bool live_only = 3; }
message ListExecutorNodesResponse { repeated ExecutorNode nodes = 1; }

message RunLogInput { string entry_id = 1; string stream = 2; string content = 3; }
message RunLogEntry {
  int64 cursor = 1;
  string entry_id = 2;
  string stream = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}
message AppendRunLogsRequest { string run_id = 1; string token = 2; repeated RunLogInput entries = 3; }
message AppendRunLogsResponse { int64 next_cursor = 1; }
message ListRunLogsRequest { string tenant_id = 1; string run_id = 2; int64 after_cursor = 3; int32 limit = 4; }
message ListRunLogsResponse { repeated RunLogEntry entries = 1; int64 next_cursor = 2; }

message NotificationChannel {
  string id = 1;
  string tenant_id = 2;
  string kind = 3;
  string name = 4;
  bool configured = 5;
  repeated string events = 6;
  bool all_jobs = 7;
  repeated string job_ids = 8;
  int32 max_attempts = 9;
  int32 backoff_initial_seconds = 10;
  int32 backoff_max_seconds = 11;
  bool enabled = 12;
  int64 version = 13;
}
message CreateNotificationChannelRequest {
  string tenant_id = 1;
  string kind = 2;
  string name = 3;
  bytes config_json = 4;
  repeated string events = 5;
  bool all_jobs = 6;
  repeated string job_ids = 7;
  int32 max_attempts = 8;
  int32 backoff_initial_seconds = 9;
  int32 backoff_max_seconds = 10;
}
message UpdateNotificationChannelRequest {
  string id = 1;
  string tenant_id = 2;
  string kind = 3;
  string name = 4;
  bytes config_json = 5;
  repeated string events = 6;
  bool all_jobs = 7;
  repeated string job_ids = 8;
  int32 max_attempts = 9;
  int32 backoff_initial_seconds = 10;
  int32 backoff_max_seconds = 11;
  int64 version = 12;
}
message SetNotificationChannelEnabledRequest {
  string id = 1;
  string tenant_id = 2;
  bool enabled = 3;
  int64 version = 4;
}
message DeleteNotificationChannelRequest {
  string id = 1;
  string tenant_id = 2;
  int64 version = 3;
}
message DeleteNotificationChannelResponse {}
message ListNotificationChannelsRequest { string tenant_id = 1; }
message ListNotificationChannelsResponse { repeated NotificationChannel channels = 1; }
message NotificationHistoryEntry {
  string delivery_id = 1;
  string event_id = 2;
  string channel_id = 3;
  string channel_name = 4;
  string channel_kind = 5;
  string topic = 6;
  string job_id = 7;
  string run_id = 8;
  string status = 9;
  int32 attempts = 10;
  string last_error = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp delivered_at = 13;
  google.protobuf.Timestamp dead_at = 14;
}
message ListNotificationHistoryRequest {
  string tenant_id = 1;
  string channel_id = 2;
  string job_id = 3;
  string status = 4;
  int32 limit = 5;
  string cursor = 6;
}
message ListNotificationHistoryResponse {
  repeated NotificationHistoryEntry deliveries = 1;
  string next_cursor = 2;
}

message GetRunReportRequest {
  string tenant_id = 1;
  string from_date = 2;
  string to_date = 3;
  string timezone = 4;
}
message RunReportPoint {
  string date = 1;
  int64 total = 2;
  int64 succeeded = 3;
  int64 failed = 4;
  int64 active = 5;
  int64 cancelled = 6;
  int64 skipped = 7;
}
message RunReport {
  string from_date = 1;
  string to_date = 2;
  string timezone = 3;
  repeated RunReportPoint points = 4;
}
message PurgeRunHistoryRequest {
  string tenant_id = 1;
  string job_id = 2;
  google.protobuf.Timestamp before = 3;
  int32 limit = 4;
}
message PurgeRunHistoryResponse { int64 deleted = 1; }

message PingRequest {}
message PingResponse {}

message User {
  string id = 1;
  string email = 2;
  string password_hash = 3;
  bool platform_admin = 4;
  bool disabled = 5;
  google.protobuf.Timestamp created_at = 6;
}
message AuthenticateAPIKeyRequest { string token = 1; }
message AuthenticateAPIKeyResponse {
  string tenant_id = 1;
  string role = 2;
}
message GetUserRequest { string id = 1; }
message GetUserByEmailRequest { string email = 1; }
message GetMembershipRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
}
message GetMembershipRoleResponse { string role = 1; }
message TenantAccess {
  string id = 1;
  string name = 2;
  string role = 3;
  int32 max_concurrent_runs = 4;
}
message ListUserTenantsRequest {
  string user_id = 1;
  bool platform_admin = 2;
}
message ListUserTenantsResponse { repeated TenantAccess tenants = 1; }
message CreateRefreshSessionRequest {
  string user_id = 1;
  int64 ttl_seconds = 2;
}
message CreateRefreshSessionResponse {
  string token = 1;
  string user_id = 2;
}
message RotateRefreshSessionRequest {
  string token = 1;
  int64 ttl_seconds = 2;
}
message RotateRefreshSessionResponse {
  string token = 1;
  string user_id = 2;
}
message RevokeRefreshSessionRequest { string token = 1; }
message RevokeRefreshSessionResponse {}
message ListUsersRequest {}
message ListUsersResponse { repeated User users = 1; }
message CreateUserRequest {
  string email = 1;
  string password_hash = 2;
  bool platform_admin = 3;
}
message SetUserDisabledRequest {
  string id = 1;
  bool disabled = 2;
}
message SetUserDisabledResponse {}
message Tenant {
  string id = 1;
  string name = 2;
  int32 max_concurrent_runs = 3;
  google.protobuf.Timestamp created_at = 4;
}
message ListTenantsRequest {}
message ListTenantsResponse { repeated Tenant tenants = 1; }
message CreateTenantRequest { string name = 1; }
message TenantMember {
  string user_id = 1;
  string email = 2;
  string role = 3;
  bool disabled = 4;
}
message ListTenantMembersRequest { string tenant_id = 1; }
message ListTenantMembersResponse { repeated TenantMember members = 1; }
message AddMembershipRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role = 3;
}
message AddMembershipResponse {}
message DeleteMembershipRequest {
  string tenant_id = 1;
  string user_id = 2;
}
message DeleteMembershipResponse {}
message APIKey {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
}
message ListAPIKeysRequest { string tenant_id = 1; }
message ListAPIKeysResponse { repeated APIKey api_keys = 1; }
message CreateAPIKeyRequest {
  string tenant_id = 1;
  string name = 2;
  string role = 3;
}
message CreateAPIKeyResponse {
  APIKey api_key = 1;
  string token = 2;
}
message RevokeAPIKeyRequest {
  string tenant_id = 1;
  string id = 2;
}
message RevokeAPIKeyResponse {}
message DashboardRun {
  string id = 1;
  string job_id = 2;
  string status = 3;
  google.protobuf.Timestamp scheduled_at = 4;
  string error_message = 5;
}
message DashboardJob {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp next_run_at = 3;
}
message Dashboard {
  int64 jobs = 1;
  int64 enabled_jobs = 2;
  int64 pending_runs = 3;
  int64 running_runs = 4;
  int64 succeeded_24h = 5;
  int64 failed_24h = 6;
  repeated DashboardRun recent_failures = 7;
  repeated DashboardJob upcoming = 8;
}
message GetDashboardRequest { string tenant_id = 1; }
message KubernetesCluster {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string auth_mode = 4;
  string api_server = 5;
  string namespace = 6;
  string kubeconfig = 7;
  string token = 8;
  string ca_data = 9;
  bool insecure_skip_tls_verify = 10;
  int32 max_concurrent_jobs = 11;
  int64 version = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}
message ListKubernetesClustersRequest { string tenant_id = 1; }
message ListKubernetesClustersResponse { repeated KubernetesCluster clusters = 1; }
message GetKubernetesClusterRequest {
  string tenant_id = 1;
  string id = 2;
}
message CreateKubernetesClusterRequest { KubernetesCluster cluster = 1; }
message UpdateKubernetesClusterRequest { KubernetesCluster cluster = 1; }
message DeleteKubernetesClusterRequest {
  string tenant_id = 1;
  string id = 2;
  int64 version = 3;
}
message DeleteKubernetesClusterResponse {}
